    <meta name="Hello, world! I'm Pun. 
    I spend my days turning daydreams into 2D illustrations, obsessed with bringing chaos, whimsy, and cutesy stuff back to the web. 
    Right now, I'm on a quest to master Motion Graphics and  UI/UX — teaching my static drawings how to move and interact with the world. 
    My goal is to make the design weirder, cuter, and fun. 
    I also love to explore and practice all kinds of traditional art mediums whether it's oil pastel, gouache, oil paint, lino-cutting, silk painting, or tattooing. 
    I would describe my artstyles as sketchy, consisting of harsh strokes, no lines, and vibrant colors."
