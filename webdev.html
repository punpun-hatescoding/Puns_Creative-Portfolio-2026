<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Design – Pun's Folio</title>
    <meta name="description" content="A passionate artist and illustrator specializing in traditional and digital mediums, dedicated to creating whimsical, vibrant artwork and exploring motion graphics and UI/UX design." />
    <link rel="icon" type="image/png" href="main-images/fat-cat.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Audiowide&family=DotGothic16&family=DynaPuff:wght@400..700&family=Griffy&family=Henny+Penny&family=Irish+Grover&family=Jacquard+12&family=Jockey+One&family=Kirang+Haerang&family=Love+Ya+Like+A+Sister&family=Mountains+of+Christmas:wght@400;700&family=Russo+One&family=UnifrakturMaguntia&family=VT323&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="npc-follower"><img src="images/cursor.svg" alt="" /></div>
    <div class="sparkle"></div>
    <a href="works.html" class="back-btn">
    <span class="arrow">←</span> Return
    </a>

    <div id="window-cinema" class="project-window hidden">
      <div
        class="window-body">
        <div class="cinema-screen" style="max-width: 100%; width: 100%; margin-top: 80px;">
          <a
            id="main-video-link"
            href="https://youtu.be/eB6poxOjdf4?si=KzCN4va78ehw2S0W"
            target="_blank"
          >
            <img
              id="main-preview-image"
              src="previews/essay1.jpeg"
              alt="Click to Watch"
            />

            <div class="play-overlay">
              <div class="play-circle">
                <span class="play-icon">▶</span>
              </div>
              <span class="play-text">WATCH ON YOUTUBE</span>
            </div>
          </a>
        </div>

        <div class="video-details-panel">
          <h2 id="video-title">The Glass Essay</h2>
          <div class="details-grid">
            <div class="detail-row">
              <span class="label">DESCRIPTION:</span>
              <p id="video-desc">
                An interactive web-based poem on the themes of memory and loss.
              </p>
            </div>
            <div class="detail-row">
              <span class="label">TOOLS:</span>
              <p id="video-tools" style="color: #b6ffea">
                HTML, CSS, JavaScript
              </p>
            </div>
          </div>
        </div>
        <div class="action-row" style="scale: 0.8;">
          <a
            href="https://punpun-hatescoding.github.io/The-Glass-Essay/"
            target="_blank"
            class="try-btn"
          >
            <span class="blink-icon" style="text-align: center;">⚡</span> TRY IT YOURSELF
          </a>
        </div>
        <div class="preview-strip">
          <div class="strip-item">
            <span class="strip-label"></span>
            <img src="previews/essay3.jpeg" alt="Extra 1" />
          </div>
          <div class="strip-item">
            <span class="strip-label"></span>
            <img src="previews/essay2.jpeg" alt="Extra 3" />
          </div>
          <div class="strip-item">
            <span class="strip-label"></span>
            <img src="previews/essay4.jpeg" alt="Extra 2" />
          </div>
          <div class="strip-item">
            <span class="strip-label"></span>
            <img src="previews/essay5.jpeg" alt="Extra 3" />
          </div>
          <div class="strip-item">
            <span class="strip-label"></span>
            <img src="previews/essay7.jpeg" alt="Extra 3" />
          </div>
          <div class="strip-item">
            <span class="strip-label"></span>
            <img src="previews/essay8.jpeg" alt="Extra 3" />
          </div>
        </div>
      </div>
    </div>
    <script src="animate.js"></script>
  </body>
</html>
